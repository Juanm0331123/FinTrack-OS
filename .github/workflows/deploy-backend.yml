name: Deploy backend (manual)

# Producción solo desde main y después de aprobar el environment `production`.
# El proyecto Vercel tiene Root Directory=backend y git.deploymentEnabled=false.
# No añadir push, pull_request ni migraciones al build de Vercel.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DESPLEGAR para confirmar el despliegue a producción'
        required: true

permissions:
  contents: read

# Comparte el bloqueo con los backups para no migrar durante un volcado/limpieza.
concurrency:
  group: fintrack-production-database
  cancel-in-progress: false

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.27.1
  # Versión exacta publicada el 2026-10-19: https://vercel.com/docs/cli/release-notes
  VERCEL_CLI_VERSION: 64.7.0
  VERCEL_TELEMETRY_DISABLED: '1'
  NO_COLOR: '1'

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DESPLEGAR' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }} vercel@${{ env.VERCEL_CLI_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: prisma generate
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://generate:generate@localhost:5432/generate
      - run: pnpm typecheck
      - run: pnpm test

      - name: Comprobar configuración del despliegue
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
          BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID BACKEND_PRODUCTION_URL PRODUCTION_DIRECT_URL; do
            if test -z "${!key}"; then
              echo "::error::Falta configurar $key en el environment production."
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          const url = new URL(process.env.BACKEND_PRODUCTION_URL)
          if (url.protocol !== 'https:' || url.username || url.password || url.port || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('BACKEND_PRODUCTION_URL debe ser el origen HTTPS estable del backend, sin ruta ni credenciales.')
          }
          NODE

      - name: Verificación previa de la migración (solo lectura)
        run: node scripts/check-migration-conflicts.ts
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Migraciones (prisma migrate deploy con URL directa)
        run: pnpm prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      # La CLI se ejecuta desde la raíz del monorepo, no desde backend/.
      # https://vercel.com/docs/monorepos#add-a-monorepo-through-vercel-cli
      - name: Descargar configuración de producción del proyecto backend
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Construir el backend para producción
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar exclusivamente el build verificado
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Smoke del dominio estable de producción
        env:
          BACKEND_PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          URL="${BACKEND_PRODUCTION_URL%/}"
          # Reintentos solo de readiness: no seguir redirects ni enviar secretos de proxy.
          READY=000
          for attempt in 1 2 3 4 5; do
            READY="$(curl --silent --show-error --connect-timeout 10 --max-time 40 -o /dev/null -w '%{http_code}' "$URL/api/health/ready")"
            if test "$READY" = 200; then break; fi
            sleep 3
          done
          test "$READY" = 200 || { echo "::error::Readiness no devuelve 200 (HTTP $READY)."; exit 1; }
          DENIED="$(curl --silent --show-error --connect-timeout 10 --max-time 40 -o /dev/null -w '%{http_code}' "$URL/api/auth/me")"
          test "$DENIED" = 403 || { echo "::error::El acceso directo sin secreto no devuelve 403 (HTTP $DENIED)."; exit 1; }

      - name: Eliminar configuración local descargada con secretos
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf -- .vercel
