allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Herramientas de build fijadas por dependencias de Next (cálculo de navegadores objetivo):
# fuerza versiones parcheadas de avisos de seguridad.
overrides:
  baseline-browser-mapping: ^2.11.0
  browserslist: ^4.28.7
  # QA frontend F-ENG-02: versiones corregidas dentro del mismo mayor que piden eslint, minimatch,
  # eslint-plugin-import y @tailwindcss/postcss (solo herramientas de desarrollo y build).
  brace-expansion@<2: 1.1.21
  brace-expansion@>=4 <6: 5.0.12
  js-yaml@>=4 <5: 4.3.2
  nanoid@<4: 3.3.18
  postcss@<9: 8.5.28
